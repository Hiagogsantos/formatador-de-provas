# Gera o executável para Windows sozinho, nos servidores do GitHub.
# Como usar: publique uma Release (ex.: v1.0.0) na página do repositório
# ou rode manualmente na aba Actions > "Gerar executável" > Run workflow.
name: Gerar executável

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt pyinstaller 

      - name: Empacotar com PyInstaller
        run: pyinstaller --noconfirm --onedir --windowed --name FormatadorDeProvas --add-data "frases_motivacionais.json;." main.py

      - name: Copiar arquivos de apoio para junto do .exe
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "provas" "dist/FormatadorDeProvas/"

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path "dist/FormatadorDeProvas" -DestinationPath "FormatadorDeProvas-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FormatadorDeProvas-windows
          path: FormatadorDeProvas-windows.zip

      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FormatadorDeProvas-windows.zip
